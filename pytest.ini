# Stays at the root, unlike the rest of the tooling in dev/: pytest looks for
# its configuration from the arguments' common ancestor upwards, so a
# dev/pytest.ini would be invisible to a bare `pytest` run from here.
#
# `pythonpath = dev` is what makes `import build_plugin` work from the tests
# without turning this repository into an installable Python package: it is a
# plugin package, and dev/ is only the tooling that validates it.
[pytest]
testpaths = dev/tests
pythonpath = dev
