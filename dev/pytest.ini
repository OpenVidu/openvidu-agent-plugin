# Development commands run from this directory, which is what makes this file
# findable: pytest resolves its configuration from the arguments' common
# ancestor upwards, so `pytest` from the repository root would not see it.
#
# `pythonpath = .` is what makes `import build_plugin` work from the tests
# without turning the repository into an installable Python package: it is a
# plugin package, and dev/ is only the tooling that validates it.
[pytest]
testpaths = tests
pythonpath = .
